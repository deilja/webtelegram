name: Production installer

on:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - '.github/workflows/production.yml'
  pull_request:
    paths:
      - '*.sh'
      - '.github/workflows/production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: |
          set -euo pipefail
          for f in ./*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck --severity=warning -e SC2034 ./*.sh

  installer-safety:
    name: Installer safety checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static safety assertions
        run: |
          set -euo pipefail
          for f in ./*.sh; do
            ! grep -nE '(^|[^A-Za-z])(curl|wget)[^\n]*\|[^\n]*(bash|sh)([^A-Za-z]|$)' "$f"
            ! grep -nE 'git clone[^\n]*tproxy-server[^\n]*(main|master)' "$f"
          done
          grep -q 'set -Eeuo pipefail' install-webproxy.sh
          grep -q '52a5feb7fac38f68da5afef9cedd9b3bfc8473ca' install-webproxy.sh
          grep -qi 'sha512' install-webproxy.sh
          grep -q '2398' install-webproxy.sh

  existing-caddy:
    name: Existing Caddy safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing-Caddy installer invariants
        run: |
          set -euo pipefail
          test -f install-webproxy-existing-caddy.sh
          bash -n install-webproxy-existing-caddy.sh
          grep -q 'caddy validate' install-webproxy-existing-caddy.sh
          grep -q 'systemctl reload caddy' install-webproxy-existing-caddy.sh
          grep -q 'webproxy-backups' install-webproxy-existing-caddy.sh
          ! grep -nE 'systemctl (stop|disable) caddy' install-webproxy-existing-caddy.sh

  xui-safe:
    name: 3X-UI/Xray safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate 3X-UI safe installer invariants
        run: |
          set -euo pipefail
          test -f install-webproxy-3xui-safe.sh
          bash -n install-webproxy-3xui-safe.sh
          grep -q 'XUI_FOUND' install-webproxy-3xui-safe.sh
          grep -q 'XUI_443' install-webproxy-3xui-safe.sh
          grep -q 'SAFE STOP' install-webproxy-3xui-safe.sh
          grep -q 'TCP 443 is occupied by an unknown service' install-webproxy-3xui-safe.sh
          grep -q 'No system changes were made after detection' install-webproxy-3xui-safe.sh
          ! grep -nE 'systemctl (stop|disable) (x-ui|xray)' install-webproxy-3xui-safe.sh
          ! grep -nE '(^|[[:space:];])rm[[:space:]]+-rf[[:space:]]+/(usr/local/x-ui|etc/x-ui|opt/3x-ui)' install-webproxy-3xui-safe.sh
          ! grep -nE '(^|[[:space:];])(sed|perl|python3?)[[:space:]].*(x-ui|xray|config\.json)' install-webproxy-3xui-safe.sh

  integration-scenarios:
    name: Production scenarios
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, existing-caddy, port-conflict, nginx-conflict, 3xui-443]
    steps:
      - uses: actions/checkout@v4
      - name: Run scenario assertions
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          case "$SCENARIO" in
            clean)
              ! grep -nE 'rm -rf[[:space:]]+\$[A-Za-z_][A-Za-z0-9_]*($|[^A-Za-z0-9_])' install-webproxy.sh
              ;;
            existing-caddy)
              grep -q 'backup' install-webproxy-existing-caddy.sh
              ;;
            port-conflict)
              grep -q '80' install-webproxy.sh
              grep -q '443' install-webproxy.sh
              grep -q 'ss ' install-webproxy.sh
              ;;
            nginx-conflict)
              grep -qi 'nginx' install-webproxy.sh
              ;;
            3xui-443)
              workdir="$(mktemp -d)"
              bin="$workdir/bin"
              mkdir -p "$bin"
              printf '%s\n' 'fixture-xray-config' > "$workdir/config.json"
              sha_before="$(sha256sum "$workdir/config.json" | cut -d' ' -f1)"

              # Mock only the external effects. The real installer is executed;
              # systemctl/apt/ss are isolated behind this temporary PATH.
              cat > "$bin/apt-get" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
              cat > "$bin/systemctl" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *"list-unit-files x-ui.service"* ]]; then
            printf 'x-ui.service enabled\n'
            exit 0
          fi
          if [[ "$*" == *"list-unit-files x-ui"* ]]; then
            printf 'x-ui.service enabled\n'
            exit 0
          fi
          exit 1
          EOF
              cat > "$bin/ss" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *":443"* ]]; then
            printf 'LISTEN 0 4096 *:443 *:* users:(("xray-linux-amd64",pid=4242,fd=9))\n'
          fi
          exit 0
          EOF
              chmod 755 "$bin"/*

              set +e
              PATH="$bin:$PATH" ./install-webproxy-3xui-safe.sh >"$workdir/output" 2>&1
              rc=$?
              set -e

              cat "$workdir/output"
              test "$rc" -eq 2
              grep -q 'SAFE STOP' "$workdir/output"
              grep -q 'Xray/3X-UI is already listening on TCP 443' "$workdir/output"
              ! grep -q 'Caddy and Xray cannot both bind' "$workdir/output" || true

              sha_after="$(sha256sum "$workdir/config.json" | cut -d' ' -f1)"
              test "$sha_before" = "$sha_after"
              test ! -e "$workdir/webproxy-backups"
              ;;
          esac
